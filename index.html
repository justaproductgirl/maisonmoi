/* ============ Events ============ */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el){ $$('.tab-group').forEach(g => g.classList.remove('open')); return; }
  const a = el.dataset.action, id = el.dataset.id;
  switch (a){
    case 'group-menu': {
      const g = el.closest('.tab-group'), was = g.classList.contains('open');
      $$('.tab-group').forEach(x => x.classList.remove('open')); g.classList.toggle('open', !was); break;
    }
    case 'tab': S.tab = el.dataset.tab; save(); render(); window.scrollTo(0, 0); break;
    case 'add-item': if (canAdd()) openItemModal(); break;
    case 'edit-item': openItemModal(id); break;
    case 'toggle-sent': { e.stopPropagation(); const it = byId(id); it.sentimental = !it.sentimental; if (it.sentimental && it.status === 'listed') it.status = 'keep'; save(); render(); toast(it.sentimental ? 'Marked sentimental: protected from resale' : 'No longer sentimental'); break; }
    case 'filter-cat': UI.cat = el.dataset.cat; render(); break;
    case 'chip': el.classList.toggle('on'); break;
    case 'close-modal': closeModal(); break;
    case 'save-item': saveItem(); break;
    case 'delete-item': if (confirm('Remove this piece from your closet? It stays in your product library so the app remembers it.')){ S.items = S.items.filter(i => i.id !== UI.editing); save(); closeModal(); render(); toast('Deleted'); } break;
    case 'set-source': UI.formSource = el.dataset.v; el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); break;

    case 'set-loc': S.day.location = el.dataset.v; save(); render(); break;
    case 'notes-toggle': { UI.notesOpen = !UI.notesOpen; el.classList.toggle('open', UI.notesOpen); el.setAttribute('aria-expanded', UI.notesOpen);
      el.nextElementSibling.classList.toggle('open', UI.notesOpen); if (UI.notesOpen) setTimeout(() => $('#day-notes').focus(), 250); break; }
    case 'toggle-moment': { const m = el.dataset.v, arr = S.day.moments; S.day.moments = arr.includes(m) ? arr.filter(x => x !== m) : [...arr, m]; save(); render(); break; }
    case 'read-day': {
      S.day.notes = $('#day-notes').value;
      const inf = inferFromText(S.day.notes);
      applyInference(inf); save(); render();
      const found = [inf.loc ? {wfh:'WFH', office:'office', hybrid:'hybrid', off:'day off'}[inf.loc] : null, ...inf.moments.map(m => MOMENTS[m].label.toLowerCase()), inf.onFeet ? 'on your feet' : null, inf.comfy ? 'extra comfy' : null].filter(Boolean);
      toast(found.length ? 'Got it: ' + found.join(', ') : "Couldn't pick out details. Try words like office, dinner, groceries, gym.");
      break;
    }
    case 'use-cal': {
      const evs = eventsFor(S.day.date);
      const inf = inferFromText(evs.map(e => (e.title || '') + ' ' + (e.location || '')).join(' . '));
      applyInference(inf); save(); render(); toast('Calendar applied to your day'); break;
    }
    case 'clear-cal': S.calendar = []; save(); render(); break;
    case 'style-me': {
      if (!useRestyle()) break;
      const n = $('#day-notes'); if (n) S.day.notes = n.value;
      generatePlan(); render(); window.scrollTo({top:0, behavior:'smooth'}); break;
    }
    case 'log-look': {
      const box = el.closest('.wear');
      const ids = [...box.querySelectorAll('.wear-one:checked:not(:disabled)')].map(c => c.value);
      if (!ids.length){ toast('Check what you wore first'); break; }
      logWear(ids, S.plan.moments); break;
    }
    case 'log-moment': { const pm = S.plan.perMoment[+el.dataset.idx]; logWear(Object.values(pm.parts), [pm.m]); break; }
    case 'nope': {
      if (!useRestyle()) break;
      const o = S.plan.options[+el.dataset.idx];
      Object.values(o.parts).forEach(pid => S.plan.moments.forEach(m => { S.prefs[m] = S.prefs[m] || {}; S.prefs[m][pid] = clamp((S.prefs[m][pid] || 0) - .35, -2, 2); }));
      generatePlan(); render(); toast("Noted. I'll steer away from that combo."); break;
    }

    case 'copy-field': { const k = listingKit(byId(id)), f = el.dataset.f; const v = f === 'tags' ? k.hashtags.map(x => '#' + x).join(' ') : k[f]; try { await navigator.clipboard.writeText(v); toast('Copied'); } catch(err){ prompt('Copy:', v); } break; }
    case 'style-keep': { const it = byId(id); it.styleKeep = true; save(); render(); toast(`Keeping ${it.name}`); break; }
    case 'style-keep-reset': { e.preventDefault(); S.items.forEach(i => delete i.styleKeep); save(); render(); break; }
    case 'shop-sizes': { S.shopUseSizes = S.shopUseSizes === false; save(); render(); break; }
    case 'shop-hide': { S.shopHidden = [...(S.shopHidden || []), el.dataset.key]; save(); render(); break; }
    case 'shop-reset': { e.preventDefault(); S.shopHidden = []; save(); render(); break; }
    case 'copy-listing': { const t = listingText(byId(id)); try { await navigator.clipboard.writeText(t); toast('Listing copied. Paste it into Depop or eBay.'); } catch(err){ prompt('Copy your listing:', t); } break; }

    case 'washed': { const it = byId(id); it.wearsSinceWash = 0; save(); render(); toast(it.name + ' is fresh'); break; }
    case 'wash-all': S.items.filter(isDirty).forEach(i => i.wearsSinceWash = 0); save(); render(); toast('Laundry day done'); break;

    case 'add-board': {
      const url = $('#board-url').value.trim(), name = $('#board-name').value.trim();
      const tags = chipVals('board-tags');
      if (!url && !name){ toast('Add a board link or name'); break; }
      const guess = name || (url.split('/').filter(Boolean).pop() || 'Board').replace(/-/g, ' ');
      S.boards.push({id:uid(), name:cap(guess), url, tags}); save(); render(); toast('Board added to your style profile'); break;
    }
    case 'board-tag': { const b = S.boards.find(x => x.id === id), v = el.dataset.v; b.tags = b.tags.includes(v) ? b.tags.filter(x => x !== v) : [...b.tags, v]; save(); render(); break; }
    case 'goal': el.classList.toggle('on'); break;
    case 'set-theme': { if (!isPlus() && el.dataset.v !== FREE.theme){ upsell('theme'); break; } S.theme = el.dataset.v; save(); render(); toast(`Wearing ${THEMES[S.theme].name}`); break; }
    case 'p-goal': {
      const g = el.dataset.v, cur = S.profile.goals;
      if (cur.includes(g) && cur.length === 1){ toast('Keep at least one goal'); break; }
      S.profile.goals = cur.includes(g) ? cur.filter(x => x !== g) : [...cur, g];
      el.classList.toggle('on'); generatePlan(); save(); render(); toast('Goals updated'); break;
    }
    case 'save-about': await saveAbout(el); break;
    case 'auth-in': await cloudAuth('in'); break;
    case 'auth-up': await cloudAuth('up'); break;
    case 'auth-reset': e.preventDefault(); await cloudAuth('reset'); break;
    case 'auth-local': e.preventDefault(); S.localOnly = true; save(); render(); break;
    case 'auth-signin': S.localOnly = false; save(); render(); break;
    case 'auth-out': await cloudSignOut(); break;
    case 'cloud-sync': await cloudPush(true); break;
    case 'start-trial': el.disabled = true; await cloudCheckout(); el.disabled = false; break;
    case 'manage-sub': el.disabled = true; await cloudPortal(); el.disabled = false; break;
    case 'save-links': {
      const links = $('#s-links').value.split(/[\s,]+/).map(x => x.trim()).filter(x => /^https?:\/\//i.test(x));
      const fresh = links.filter(u => !S.boards.some(b => b.url === u));
      fresh.forEach(u => S.boards.push({id:uid(), name:boardNameFromUrl(u), url:u, tags:[], pending:true}));
      S.profile.links = links; save(); render();
      toast(fresh.length ? `Saved. ${fresh.length} new link${fresh.length > 1 ? 's' : ''} added to Inspiration.` : 'Links saved'); break;
    }
    case 'finish-setup': finishSetup(el); break;
    case 'open-build': if (!canAdd()) break; S.tab = 'build'; UI.fromSetup = false; save(); render(); window.scrollTo(0, 0); break;
    case 'skip-build': UI.fromSetup = false; S.tab = 'today'; save(); render(); break;
    case 'import-links': el.disabled = true; await importLinks($('#links-in').value); break;
    case 'add-drafts': addDrafts(); break;
    case 'clear-drafts': if (confirm('Clear everything staged here?')){ S.drafts = []; save(); render(); } break;
    case 'draft-del': S.drafts = S.drafts.filter(d => d.id !== id); save(); render(); break;
    case 'draft-star': { const d = S.drafts.find(x => x.id === id); d.sentimental = !d.sentimental; el.classList.toggle('on', d.sentimental); el.textContent = d.sentimental ? '★' : '☆'; save(); break; }
    case 'draft-img': { const d = S.drafts.find(x => x.id === id); d.imgIdx = (d.imgIdx + +el.dataset.dir + d.colorImgs.length) % d.colorImgs.length; d.img = sized(d.colorImgs[d.imgIdx]); save(); render(); break; }
    case 'edit-profile': S.tab = 'profile'; save(); render(); window.scrollTo(0, 0); break;
    case 'cancel-setup': UI.editProfile = false; UI.loc = null; render(); break;
    case 'del-board': S.boards = S.boards.filter(b => b.id !== id); save(); render(); break;
    case 'toggle-vibe': { const v = el.dataset.v; S.vibes = S.vibes.includes(v) ? S.vibes.filter(x => x !== v) : [...S.vibes, v]; save(); render(); break; }
    case 'add-pin': {
      const img = UI.pinImg || $('#pin-url').value.trim();
      if (!img){ toast('Upload an image or paste a URL'); break; }
      S.pins.unshift({id:uid(), img, tags:chipVals('pin-tags')}); UI.pinImg = null; save(); render(); toast('Look saved'); break;
    }
    case 'del-pin': S.pins = S.pins.filter(p => p.id !== id); save(); render(); break;

    case 'lib-export': download(`closet-products-${todayISO()}.csv`, productsCSV(), 'text/csv'); toast('Exported products CSV'); break;
    case 'lib-template': download('closet-products-template.csv', '\ufeff' + CSV_COLS.map(c => c[0]).join(',') + '\r\n' + ',yes,keep,Cropped Denim Jacket,Levi\'s,outerwear,denim,Medium Stonewash,M,98,Good,2,4,casual; classic,fall; spring,8,no,0,,https://...,https://...,,,Bought on sale\r\n', 'text/csv'); break;
    case 'lib-import': $('#csv-file').click(); break;
    case 'csv-apply': applyCSV(); break;
    case 'lib-filter': UI.libF = el.dataset.f; render(); break;
    case 'lib-readd': { if (!canAdd()) break; const p = S.products.find(x => x.id === id); p.status = 'keep'; S.items.unshift(itemFromProduct(p)); generatePlan(); save(); render(); toast(`${p.name} is back in your closet`); break; }
    case 'lib-forget': if (confirm('Forget this product completely?')){ S.products = S.products.filter(x => x.id !== id); dropHostedPhoto(id); save(); render(); } break;
    case 'disk-connect': await connectFolder(); break;
    case 'disk-reconnect': await reconnectFolder(); break;
    case 'disk-read': await readDiskCSV(); break;
    case 'disk-off': DISK.dir = null; DISK.pending = null; await idb(st => st.delete('dir')); render(); toast('Folder disconnected. Your library is still saved in the app.'); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'});
      const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `maison-moi-${todayISO()}.json`; link.click(); break;
    }
    case 'import': $('#import-file').click(); break;
    case 'clear-demo': if (confirm('Remove all demo items and demo boards?')){ S.items = S.items.filter(i => !i.demo); S.boards = S.boards.filter(b => !b.demo); S.plan = null; save(); render(); toast('Demo data removed'); } break;
    case 'reset-all': if (confirm('Erase everything (closet and product library) and start over with demo data?')){ localStorage.removeItem(LS_KEY); Object.keys(IMGS).forEach(dropHostedPhoto); S = seed(); S.drafts = []; S.products = []; save(); render(); } break;
  }
});

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.classList.contains('f-file') && t.files[0]){
    try { UI.formImg = await resizeImage(t.files[0]); $('#f-preview').src = UI.formImg; $('#f-imgurl').value = ''; }
    catch(err){ toast("Couldn't read that photo. Try a JPG or PNG."); }
  }
  if (t.id === 'f-imgurl'){
    const v = t.value.trim();
    if (v && !looksLikeImage(v)){ t.value = ''; $('#f-url').value = v; fillFromProduct(v); }   // a product page pasted into the image box
    else { UI.formImg = v; if (v) $('#f-preview').src = v; else refreshPreview(); }
  }
  if (t.id === 'f-url' && /^https?:/.test(t.value.trim())) fillFromProduct(t.value.trim());
  if (t.classList.contains('f-vsel') && UI.formDraft){
    const d = UI.formDraft; d.sel[+t.dataset.opt] = t.value; applyVariant(d);
    if (d.img){ UI.formImg = d.img; $('#f-preview').src = d.img; }
    if (d.colorName) $('#f-colorname').value = d.colorName;
    if (d.size) $('#f-size').value = d.size;
    $('#f-color').value = d.color; if (d.price) $('#f-price').value = d.price;
  }
  if (t.id === 'f-cat' || t.id === 'f-color'){
    refreshPreview();
    if (t.id === 'f-cat' && !UI.editing) $('#f-wash').value = CATS[t.value].wash;
  }
  if ((t.id === 'bulk-files' || t.id === 'bulk-cam') && t.files.length) addPhotoDrafts(t.files);
  if (t.dataset.draftPhoto && t.files[0]){ const d = S.drafts.find(x => x.id === t.dataset.draftPhoto); d.img = await resizeImage(t.files[0]); d.needsPhoto = false; save(); render(); }
  if (t.dataset.draft){
    const d = S.drafts.find(x => x.id === t.dataset.draft);
    if (t.dataset.opt != null){ d.sel[+t.dataset.opt] = t.value; applyVariant(d); save(); render(); }
    else if (t.dataset.field === 'imgurl'){ d.img = t.value.trim(); d.needsPhoto = !d.img; save(); render(); }
    else {
      d[t.dataset.field] = t.value;
      if (t.dataset.field === 'category'){ d.washEvery = CATS[t.value].wash; Object.assign(d, guessFit(t.value, d.name)); }
      save();
    }
  }
  if (t.id === 'pin-file' && t.files[0]){ UI.pinImg = await resizeImage(t.files[0], 500); toast('Image ready. Pick vibes and save.'); }
  if (t.id === 'ics' && t.files[0]){
    const evs = parseICS(await t.files[0].text());
    S.calendar = evs; save(); render();
    toast(`Imported ${evs.length} events (${eventsFor(S.day.date).length} on this date)`);
  }
  if (t.id === 'day-date'){ S.day.date = t.value || todayISO(); S._keepDate = S.day.date !== todayISO(); applyForecast(); save(); render(); }
  if (t.classList.contains('day-type')){ const m = t.value; S.day.moments = t.checked ? [...new Set([...S.day.moments, m])] : S.day.moments.filter(x => x !== m); save(); }
  if (t.id === 'no-trends'){ S.noTrends = t.checked; save(); render(); }
  if (t.id === 'on-feet'){ S.day.onFeet = t.checked; save(); }
  if (t.id === 'day-notes'){ S.day.notes = t.value; save(); }
  if (t.classList.contains('wear-all')){ t.closest('.wear').querySelectorAll('.wear-one:not(:disabled)').forEach(c => c.checked = t.checked); }
  if (t.dataset.change === 'status'){
    const it = byId(t.dataset.id); it.status = t.value; save(); render();
    toast(t.value === 'sold' ? 'Nice! Marked as sold and removed from outfit picks.' : t.value === 'listed' ? 'Marked as listed' : 'Keeping it');
  }
  if (t.id === 'csv-file' && t.files[0]){
    try { const rows = parseCSV(await t.files[0].text()); if (!rows.length) throw 0; openCSVPreview(rows, t.files[0].name); }
    catch(err){ toast("Couldn't read that CSV"); }
    t.value = '';
  }
  if (t.dataset.libNote){ const p = S.products.find(x => x.id === t.dataset.libNote); p.notes = t.value.trim(); p.updatedAt = new Date().toISOString(); save(); }
  if (t.id === 'import-file' && t.files[0]){
    try { const d = JSON.parse(await t.files[0].text()); if (!d.items) throw 0; S = d; S.drafts = S.drafts || []; S.products = S.products || []; save(); render(); toast('Backup restored'); }
    catch(err){ toast("That file doesn't look like a Maison Moi backup"); }
    t.value = '';
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 's-zip'){
    const zip = t.value.replace(/\D/g, '').slice(0, 5); t.value = zip;
    const pill = $('#loc-pill');
    if (zip.length < 5){ UI.loc = null; pill.innerHTML = '<span class="muted">Used for your daily forecast</span>'; return; }
    pill.innerHTML = '<span class="muted">Finding you...</span>';
    lookupZip(zip).then(loc => {
      if (t.value !== zip) return;
      UI.loc = loc;
      pill.innerHTML = loc ? `<span style="color:var(--sage)">📍 ${esc(loc.city)}, ${esc(loc.state)}: weather will auto-update</span>` : '<span style="color:var(--rose)">Couldn\'t find that zip code</span>';
    });
  }
  if (t.id === 'q'){ UI.q = t.value; $('#closet-grid').innerHTML = closetGrid(); }
  if (t.id === 'lib-q'){ UI.libQ = t.value; const pos = t.selectionStart; render(); const n = $('#lib-q'); n.focus(); n.setSelectionRange(pos, pos); }
  if (t.id === 'day-notes') liveReadDay(t.value);
  if (t.id === 'comfort'){ S.day.comfort = +t.value; $('#comfort-lbl').textContent = `${t.value}/5 · ${COMFORT_LABELS[t.value]}`; save(); }
  if (t.id === 'f-form') $('#f-form-v').textContent = t.value + '/5';
  if (t.id === 'f-comf') $('#f-comf-v').textContent = t.value + '/5';
});
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => { const z = e.target.closest && e.target.closest('#drop'); if (z){ e.preventDefault(); z.classList.add('over'); } }));
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('#drop'); if (z) z.classList.remove('over'); });
document.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('#drop'); if (z){ e.preventDefault(); z.classList.remove('over'); addPhotoDrafts(e.dataTransfer.files); } });
$('#modal-wrap').addEventListener('click', e => { if (e.target.id === 'modal-wrap') closeModal(); });
// If a store photo fails, retry once without resize params, then show a clear placeholder instead of a broken icon.
const BROKEN = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240"><rect width="200" height="240" fill="#f4f4f2"/><path d="M70 70h60l18 18v82H52V88z" fill="none" stroke="#0b0b0b" stroke-width="3"/><text x="100" y="205" font-family="Helvetica,Arial" font-size="13" font-weight="700" text-anchor="middle" fill="#0b0b0b">PHOTO DIDN\'T LOAD</text></svg>');
document.addEventListener('error', e => {
  const img = e.target; if (img.tagName !== 'IMG' || img.src.startsWith('data:')) return;
  if (!img.dataset.retry && /[?&]width=/.test(img.src)){ img.dataset.retry = 1; img.src = img.src.replace(/[?&]width=\d+/, ''); return; }
  console.warn('Image failed:', img.src); img.src = BROKEN;
}, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); if (e.key === 'Enter' && e.target.closest('.au')) cloudAuth('in'); });

/* ============ Boot ============ */
syncLibrary();
// One-time chores Claude can queue in commands.js (each id runs once per browser).
(function runCommands(){
  if (!(S.profile && S.profile.done)) return;
  const done = S.commandsDone = S.commandsDone || [];
  for (const c of (Array.isArray(window.CLOSET_COMMANDS) ? window.CLOSET_COMMANDS : [])){
    if (!c || !c.id || done.includes(c.id)) continue;
    if (c.do === 'clear-demo'){
      const n = S.items.filter(i => i.demo).length;
      S.items = S.items.filter(i => !i.demo); S.boards = S.boards.filter(b => !b.demo); S.plan = null;
      if (n) setTimeout(() => toast(`Removed ${n} demo pieces`), 900);
    }
    done.push(c.id); save();
  }
})();
if (S.profile && S.profile.done){
  const added = mergeCatalog(), updated = mergeCatalog.updated;
  if (added || updated){
    generatePlan(); save();
    const msg = [added && `added ${added} piece${added > 1 ? 's' : ''}`, updated && `updated ${updated}`].filter(Boolean).join(', ');
    setTimeout(() => toast(msg[0].toUpperCase() + msg.slice(1) + ' from your catalog'), 400);
  }
}
restoreFolder();
loadHostedPhotos().then(() => { if (Object.keys(IMGS).length) render(); hostPhotos(); });
applyForecast();
if (!S.plan || S.plan.date !== S.day.date) generatePlan();
render();
cloudStart();
if (S.profile && S.profile.done){
  const before = S.weather && S.weather.at;
  fetchWeather().then(() => { if (S.weather && S.weather.at !== before){ generatePlan(); render(); } });
}
</script>
