<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submit feedback · Maison Moi</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{--bg:#f2f2f0;--card:#fff;--ink:#0b0b0b;--muted:#6e6e6e;--line:#dcdcdc;
  --serif:"Helvetica Neue",Helvetica,Arial,sans-serif;--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6}
header{background:var(--ink);color:#fff}
header .bar{max-width:820px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:10px}
header a{color:#fff;text-decoration:none;font-family:var(--serif);font-weight:800;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;display:block;box-shadow:0 0 0 1.5px #fff}
main{max-width:820px;margin:0 auto;padding:36px 24px 70px}
.card{background:var(--card);border:1.5px solid var(--ink);padding:34px 38px}
h1{font-family:var(--serif);font-size:40px;line-height:1.05;text-transform:uppercase;margin:0 0 6px}
h2{font-family:var(--serif);font-size:19px;text-transform:uppercase;letter-spacing:.5px;margin:34px 0 8px}
.eyebrow,.updated{font-family:var(--mono);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.lead{font-size:17px}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:500}
ul{padding-left:20px}li{margin:4px 0}
a{color:var(--ink)}
.back{display:inline-block;margin-bottom:14px;font-family:var(--mono);font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-decoration:none}
@media (max-width:600px){.card{padding:24px 20px}h1{font-size:30px}}
label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--ink);border-radius:0;padding:11px 12px}
textarea{min-height:160px;resize:vertical}
.btn{display:inline-block;margin-top:20px;background:var(--ink);color:#fff;border:1.5px solid var(--ink);border-radius:0;padding:13px 22px;font-family:var(--mono);font-size:13px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.msg{margin-top:14px;font-size:14px}.msg.bad{color:#b00020}
.small{font-size:13px;color:var(--muted)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
footer.site{max-width:820px;margin:0 auto;padding:0 24px 40px;display:flex;flex-wrap:wrap;gap:8px 22px;font-family:var(--mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
footer.site a{color:var(--muted);text-decoration:none}footer.site a:hover{color:var(--ink)}
</style>
</head>
<body>
<header><div class="bar"><a href="./"><img class="mark" src="icon.svg" alt="">Maison Moi</a></div></header>
<main>
<a class="back" href="./">← Back to Maison Moi</a>
<div class="card">
<div class="eyebrow">Maison Moi</div>
<h1>Submit feedback</h1>
<p class="lead">Ideas, bugs, things you love: tell us. Every note is read, and it shapes what we build next.</p>
<div id="fb">Loading…</div>
</div>
</main>
<footer class="site"><a href="feedback.html">Submit feedback</a><a href="contact.html">Contact us</a><a href="privacy.html">Privacy Policy</a><span style="color:var(--muted)">© 2026 Maison Moi</span></footer>
<script src="vendor/supabase-js-2.117.3.js"></script>
<script src="cloud.js"></script>
<script>
// Signed-in people only: the note is saved to the feedback table with their account, so we can follow up.
const box = document.getElementById('fb');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const db = window.supabase && supabase.createClient(CLOUD_URL, CLOUD_KEY);
const signedOut = () => box.innerHTML = `<p>Please sign in to send feedback, so we know who it's from and can follow up.</p>
  <a class="btn" href="./">Sign in</a> <a class="btn ghost" href="contact.html">Contact us instead</a>`;
function form(user){
  box.innerHTML = `<form id="f">
    <label for="cat">What kind of feedback?</label>
    <select id="cat"><option value="idea">An idea or request</option><option value="bug">Something isn't working</option><option value="love">Something I love</option><option value="other">Something else</option></select>
    <label for="m">Your feedback</label>
    <textarea id="m" maxlength="4000" required placeholder="Tell us what's on your mind"></textarea>
    <div class="small">Sending as ${esc(user.email || 'your account')}.</div>
    <button class="btn" id="go">Send feedback</button>
    <div class="msg" id="say" role="status"></div>
  </form>`;
  const say = (t, bad) => { const s = document.getElementById('say'); s.textContent = t; s.className = 'msg' + (bad ? ' bad' : ''); };
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    const message = document.getElementById('m').value.trim();
    if (!message) return say('Please write a little something first.', true);
    const go = document.getElementById('go'); go.disabled = true; say('Sending…');
    const {error} = await db.from('feedback').insert({email: user.email, category: document.getElementById('cat').value, message,
      page: document.referrer.slice(0, 300) || null, user_agent: navigator.userAgent.slice(0, 500)});
    if (error){ go.disabled = false; return say("That didn't send. Check your connection and try again.", true); }
    box.innerHTML = `<p><b>Thank you.</b> Your feedback is in, and we read every note.</p>
      <a class="btn" href="./">Back to Maison Moi</a> <a class="btn ghost" href="feedback.html">Send another</a>`;
  };
}
(async () => {
  if (!db) return box.innerHTML = `<p>We couldn't connect right now. Please try again later, or <a href="contact.html">contact us</a>.</p>`;
  const {data} = await db.auth.getSession(); // the same browser session as the app
  data.session ? form(data.session.user) : signedOut();
})();
</script>
</body>
</html>
